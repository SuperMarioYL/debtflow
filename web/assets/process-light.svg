<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" data-palette="71e656-6ae796-d5f6ac-2591e8e288e7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"><rect width="1000" height="440" fill="#fafef9"/><defs><marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#408231"/></marker><marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7b6b"/></marker></defs><text x="40" y="52" font-size="17"><tspan fill="#172a1c">Interest recomputed from the git graph on every read</tspan></text><text x="960" y="52" font-size="12" text-anchor="end"><tspan fill="#5b7b6b">git is the single source of truth · ledger = derived state</tspan></text><line x1="120" y1="100" x2="120" y2="380" stroke="#d4f7cb" stroke-width="2"/><circle cx="120" cy="110" r="6" fill="#172a1c"/><text x="136" y="114" font-size="11"><tspan fill="#5b7b6b">HEAD</tspan></text><circle cx="120" cy="165" r="6" fill="#3b8154"/><text x="136" y="169" font-size="10.5"><tspan fill="#5b7b6b">stacked commits</tspan></text><circle cx="120" cy="215" r="6" fill="#3b8154"/><rect x="112" y="290" width="16" height="16" rx="3" fill="#408231"/><text x="136" y="302" font-size="10.5"><tspan fill="#408231">agent commit — the debt</tspan></text><circle cx="120" cy="360" r="6" fill="#f8fef7" stroke="#5b7b6b" stroke-width="1.5"/><text x="136" y="364" font-size="10.5"><tspan fill="#5b7b6b">merge-base anchor</tspan></text><path d="M120,330 C150,330 160,315 185,315" fill="none" stroke="#5b7b6b" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85"/><circle cx="185" cy="315" r="4.5" fill="#f8fef7" stroke="#5b7b6b" stroke-width="1.2"/><text x="196" y="318" font-size="10"><tspan fill="#5b7b6b">side-branch merge — not counted</tspan></text><line x1="298" y1="205" x2="326" y2="205" stroke="#408231" stroke-width="1.5" marker-end="url(#arr-p)"/><rect x="330" y="155" width="230" height="100" rx="10" fill="#f8fef7" stroke="#d4f7cb" stroke-width="1.5"/><text x="445" y="190" font-size="14.5" text-anchor="middle"><tspan fill="#172a1c">debtflow init</tspan></text><text x="445" y="212" font-size="10.5" text-anchor="middle"><tspan fill="#5b7b6b">entry + savepoint ref</tspan></text><text x="445" y="234" font-size="11" text-anchor="middle"><tspan fill="#408231">refs/debtflow/&lt;id&gt;</tspan></text><line x1="562" y1="205" x2="594" y2="205" stroke="#408231" stroke-width="1.5" marker-end="url(#arr-p)"/><rect x="600" y="100" width="360" height="240" rx="10" fill="#f8fef7" stroke="#d4f7cb" stroke-width="1.5"/><text x="780" y="132" font-size="14.5" text-anchor="middle"><tspan fill="#172a1c">debtflow board</tspan></text><text x="780" y="152" font-size="10.5" text-anchor="middle"><tspan fill="#5b7b6b">recomputed on every read</tspan></text><rect x="622" y="179" width="8" height="8" fill="#408231"/><text x="642" y="190" font-size="13"><tspan fill="#408231">DEPENDENT COMMITS</tspan></text><text x="642" y="208" font-size="10.5"><tspan fill="#5b7b6b">first-parent line · merge-base anchored</tspan></text><rect x="622" y="223" width="8" height="8" fill="#3b8154"/><text x="642" y="234" font-size="13"><tspan fill="#3b8154">TOUCHED FILES</tspan></text><text x="642" y="252" font-size="10.5"><tspan fill="#5b7b6b">the change's own diff</tspan></text><rect x="622" y="267" width="8" height="8" fill="#697955"/><text x="642" y="278" font-size="13"><tspan fill="#697955">BLAST RADIUS</tspan></text><text x="642" y="296" font-size="10.5"><tspan fill="#5b7b6b">stacked commits, beyond the change's file set</tspan></text><text x="40" y="412" font-size="11"><tspan fill="#5b7b6b">deterministic git-graph math — anyone re-running gets the same numbers · side-branch merges do not count</tspan></text></svg>
