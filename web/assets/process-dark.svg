<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" data-palette="71e656-6ae796-d5f6ac-2591e8e288e7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"><rect width="1000" height="440" fill="#060c0d"/><defs><marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71e656"/></marker><marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9bb9a8"/></marker></defs><text x="40" y="52" font-size="17"><tspan fill="#f7fdee">Interest recomputed from the git graph on every read</tspan></text><text x="960" y="52" font-size="12" text-anchor="end"><tspan fill="#9bb9a8">git is the single source of truth · ledger = derived state</tspan></text><line x1="120" y1="100" x2="120" y2="380" stroke="#1e3c1d" stroke-width="2"/><circle cx="120" cy="110" r="6" fill="#f7fdee"/><text x="136" y="114" font-size="11"><tspan fill="#9bb9a8">HEAD</tspan></text><circle cx="120" cy="165" r="6" fill="#6ae796"/><text x="136" y="169" font-size="10.5"><tspan fill="#9bb9a8">stacked commits</tspan></text><circle cx="120" cy="215" r="6" fill="#6ae796"/><rect x="112" y="290" width="16" height="16" rx="3" fill="#71e656"/><text x="136" y="302" font-size="10.5"><tspan fill="#71e656">agent commit — the debt</tspan></text><circle cx="120" cy="360" r="6" fill="#0d1717" stroke="#9bb9a8" stroke-width="1.5"/><text x="136" y="364" font-size="10.5"><tspan fill="#9bb9a8">merge-base anchor</tspan></text><path d="M120,330 C150,330 160,315 185,315" fill="none" stroke="#9bb9a8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85"/><circle cx="185" cy="315" r="4.5" fill="#0d1717" stroke="#9bb9a8" stroke-width="1.2"/><text x="196" y="318" font-size="10"><tspan fill="#9bb9a8">side-branch merge — not counted</tspan></text><line x1="298" y1="205" x2="326" y2="205" stroke="#71e656" stroke-width="1.5" marker-end="url(#arr-p)"/><rect x="330" y="155" width="230" height="100" rx="10" fill="#0d1717" stroke="#1e3c1d" stroke-width="1.5"/><text x="445" y="190" font-size="14.5" text-anchor="middle"><tspan fill="#f7fdee">debtflow init</tspan></text><text x="445" y="212" font-size="10.5" text-anchor="middle"><tspan fill="#9bb9a8">entry + savepoint ref</tspan></text><text x="445" y="234" font-size="11" text-anchor="middle"><tspan fill="#71e656">refs/debtflow/&lt;id&gt;</tspan></text><line x1="562" y1="205" x2="594" y2="205" stroke="#71e656" stroke-width="1.5" marker-end="url(#arr-p)"/><rect x="600" y="100" width="360" height="240" rx="10" fill="#0d1717" stroke="#1e3c1d" stroke-width="1.5"/><text x="780" y="132" font-size="14.5" text-anchor="middle"><tspan fill="#f7fdee">debtflow board</tspan></text><text x="780" y="152" font-size="10.5" text-anchor="middle"><tspan fill="#9bb9a8">recomputed on every read</tspan></text><rect x="622" y="179" width="8" height="8" fill="#71e656"/><text x="642" y="190" font-size="13"><tspan fill="#71e656">DEPENDENT COMMITS</tspan></text><text x="642" y="208" font-size="10.5"><tspan fill="#9bb9a8">first-parent line · merge-base anchored</tspan></text><rect x="622" y="223" width="8" height="8" fill="#6ae796"/><text x="642" y="234" font-size="13"><tspan fill="#6ae796">TOUCHED FILES</tspan></text><text x="642" y="252" font-size="10.5"><tspan fill="#9bb9a8">the change's own diff</tspan></text><rect x="622" y="267" width="8" height="8" fill="#d5f6ac"/><text x="642" y="278" font-size="13"><tspan fill="#d5f6ac">BLAST RADIUS</tspan></text><text x="642" y="296" font-size="10.5"><tspan fill="#9bb9a8">stacked commits, beyond the change's file set</tspan></text><text x="40" y="412" font-size="11"><tspan fill="#9bb9a8">deterministic git-graph math — anyone re-running gets the same numbers · side-branch merges do not count</tspan></text></svg>
