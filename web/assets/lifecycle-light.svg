<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" data-palette="71e656-6ae796-d5f6ac-2591e8e288e7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace"><rect width="1000" height="540" fill="#fafef9"/><defs><marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b7b6b"/></marker><marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#408231"/></marker></defs><text x="40" y="52" font-size="17"><tspan fill="#172a1c">One entry, appended events, three ways to settle</tspan></text><text x="960" y="52" font-size="12" text-anchor="end"><tspan fill="#5b7b6b">.debtflow/ledger.jsonl — append-only</tspan></text><rect x="60" y="110" width="190" height="80" rx="10" fill="#f8fef7" stroke="#d4f7cb" stroke-width="1.5"/><text x="155" y="148" font-size="14.5" text-anchor="middle"><tspan fill="#172a1c">imported</tspan></text><text x="155" y="170" font-size="10" text-anchor="middle"><tspan fill="#5b7b6b">init registers the debt</tspan></text><line x1="252" y1="150" x2="294" y2="150" stroke="#5b7b6b" stroke-width="1.4" marker-end="url(#arr-m)"/><rect x="300" y="110" width="250" height="80" rx="10" fill="#f8fef7" stroke="#d4f7cb" stroke-width="1.5"/><text x="425" y="148" font-size="14.5" text-anchor="middle"><tspan fill="#172a1c">accrued</tspan></text><text x="425" y="170" font-size="10" text-anchor="middle"><tspan fill="#5b7b6b">interest snapshot on every read</tspan></text><path d="M340,110 C340,84 510,84 510,110" fill="none" stroke="#5b7b6b" stroke-width="1.2" stroke-dasharray="4 4"/><text x="425" y="76" font-size="9.5" text-anchor="middle"><tspan fill="#5b7b6b">board · paydown · refinance · default recompute first</tspan></text><path d="M425,190 V240 H195 V284" fill="none" stroke="#5b7b6b" stroke-width="1.4" marker-end="url(#arr-m)"/><path d="M425,190 V240 H500 V284" fill="none" stroke="#5b7b6b" stroke-width="1.4" marker-end="url(#arr-m)"/><path d="M425,190 V240 H805 V284" fill="none" stroke="#5b7b6b" stroke-width="1.4" marker-end="url(#arr-m)"/><rect x="60" y="290" width="270" height="130" rx="10" fill="#f8fef7" stroke="#408231" stroke-width="2"/><text x="195" y="330" font-size="15" text-anchor="middle"><tspan fill="#408231">paid</tspan></text><text x="195" y="356" font-size="10.5" text-anchor="middle"><tspan fill="#5b7b6b">review passed — interest frozen</tspan></text><text x="195" y="374" font-size="10.5" text-anchor="middle"><tspan fill="#5b7b6b">at its last reading</tspan></text><rect x="365" y="290" width="270" height="130" rx="10" fill="#f8fef7" stroke="#3b8154" stroke-width="2"/><text x="500" y="330" font-size="15" text-anchor="middle"><tspan fill="#3b8154">refinanced</tspan></text><text x="500" y="356" font-size="10.5" text-anchor="middle"><tspan fill="#5b7b6b">two open entries → one fresh entry</tspan></text><text x="500" y="374" font-size="10.5" text-anchor="middle"><tspan fill="#5b7b6b">covering the combined range</tspan></text><rect x="670" y="290" width="270" height="130" rx="10" fill="#f8fef7" stroke="#d4f7cb" stroke-width="2"/><text x="805" y="330" font-size="15" text-anchor="middle"><tspan fill="#172a1c">defaulted</tspan></text><text x="805" y="356" font-size="10.5" text-anchor="middle"><tspan fill="#5b7b6b">savepoint tree restored + committed</tspan></text><rect x="700" y="386" width="210" height="26" rx="13" fill="#f8fef7" stroke="#408231" stroke-width="1.2"/><text x="805" y="403" font-size="10" text-anchor="middle"><tspan fill="#408231">refs/debtflow/&lt;id&gt; → clean tree</tspan></text><rect x="60" y="460" width="880" height="54" rx="10" fill="#f5fdf3" stroke="#d4f7cb" stroke-width="1.2"/><text x="80" y="482" font-size="11"><tspan fill="#5b7b6b">events: imported / accrued / paid / refinanced / defaulted — one line per entry, never deleted or reordered</tspan></text><text x="80" y="502" font-size="11"><tspan fill="#5b7b6b">writes: temp file + rename — git is the single source of truth, rebuild from history any time</tspan></text></svg>
